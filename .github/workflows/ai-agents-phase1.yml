name: CJ research agents phase 1 (isolated branch)
on:
  push:
    branches: [dev/ai-agents-phase1]
    paths:
      - 'backtest/agents/**'
      - '.github/workflows/ai-agents-phase1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-agent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test isolated deterministic research agents
        run: node --test backtest/agents/*.test.mjs
      - name: End-to-end six-role synthetic smoke and fail-closed check
        run: node backtest/agents/ci-smoke.mjs
      - name: Save explicitly synthetic six-role smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cj-six-role-SYNTHETIC-smoke
          path: ${{ runner.temp }}/cj-workshop-synthetic-smoke/report/
          retention-days: 7
          if-no-files-found: warn
