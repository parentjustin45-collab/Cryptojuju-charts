name: Compare Bitunix and CryptoJuju history
on:
  push:
    branches: [dev/v1.26.0]
    paths:
      - '.github/workflows/compare-history.yml'
      - 'backtest/compare-sources.mjs'
      - 'backtest/bitunix-diagnostics.mjs'
      - 'backtest/probe-server.mjs'
      - 'backtest/cryptojuju-adapter.mjs'
      - 'backtest/bitunix-adapter.mjs'
      - 'backtest/multipage-smoke.mjs'
      - 'backtest/retry-missing.mjs'
      - 'backtest/ohlc-precision-diagnostic.mjs'
  workflow_dispatch:
jobs:
  compare-history:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe CryptoJuju API routes
        run: node backtest/probe-server.mjs
      - name: Diagnose rejected Bitunix candles
        run: node backtest/bitunix-diagnostics.mjs
      - name: Compare live BTCUSDT 15m sources
        run: node backtest/compare-sources.mjs
      - name: Validate seven days of paginated BTCUSDT 15m history
        if: always()
        run: node backtest/multipage-smoke.mjs
      - name: Retry missing 15m candles without modifying prices
        if: always()
        run: node backtest/retry-missing.mjs
      - name: Diagnose raw OHLC precision without altering prices
        if: always()
        run: node backtest/ohlc-precision-diagnostic.mjs
