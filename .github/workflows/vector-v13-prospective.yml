name: Vector V1.3 BTC 1H SHORT prospective EMA50 (dev only)
on:
  push:
    branches: [dev/v1.26.0]
    paths:
      - '.github/workflows/vector-v13-prospective.yml'
      - 'backtest/vector-v13-prospective.mjs'
      - 'backtest/vector-v13-prospective.test.mjs'
  workflow_dispatch:
jobs:
  vector-v13-prospective:
    if: github.ref == 'refs/heads/dev/v1.26.0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frozen start, no-lookahead, event parity and costs
        run: node --test backtest/vector-v13-prospective.test.mjs backtest/vector-v13-regime.test.mjs
      - name: Observe prospective closed Bitunix candles, never place orders
        run: node backtest/vector-v13-prospective.mjs > vector-v13-prospective.json
      - name: Archive complete future comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vector-v13-btc-short-ema50-forward
          path: vector-v13-prospective.json
          if-no-files-found: warn
