name: DEV autonomous bounded research queue
on:
  push:
    branches: [dev/ai-agents-phase1]
    paths:
      - 'backtest/agents/render/autonomous-*'
      - '.github/workflows/ai-agents-autonomous-queue.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check backtest/agents/render/supervisor.mjs
      - run: node --test backtest/agents/render/autonomous-experiment-worker.test.mjs backtest/agents/render-runtime.test.mjs backtest/agents/render/historical-targeted-v3-experiments.test.mjs
