name: DEV Bitunix 1H block ingestion diagnostics (read only)
on:
  push:
    branches: [dev/v1.26.0]
    paths:
      - 'backtest/bitunix-block-diagnostic.mjs'
      - 'backtest/bitunix-block-diagnostic.test.mjs'
      - 'backtest/bitunix-real-ingestion-audit.mjs'
      - '.github/workflows/bitunix-block-diagnostic.yml'
  workflow_dispatch:
jobs:
  verify:
    if: github.ref == 'refs/heads/dev/v1.26.0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test strict recovery and quarantine without simulated candles
        run: node --test backtest/bitunix-block-diagnostic.test.mjs
      - name: Compare real Bitunix 1H ingestion before and after targeted retries
        run: node backtest/bitunix-real-ingestion-audit.mjs > bitunix-ingestion-report.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cj-bitunix-real-ingestion-diagnostic
          path: bitunix-ingestion-report.json
          if-no-files-found: warn
