<!doctype html><html lang=fr><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>CryptoJuju Route Lab Extended V1.23.19</title><style>
body{margin:0;padding:15px;background:#06100c;color:#ecfff4;font-family:system-ui}h1{font-size:20px;margin:0}.sub{font-size:13px;color:#94b7a5;margin:5px 0 13px}.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.x,.r{border:1px solid #24573d;background:#0a1711;border-radius:12px;padding:11px}label{font-size:12px;color:#9bb9aa}input,select,button{width:100%;box-sizing:border-box;margin-top:5px;padding:10px;border-radius:8px;border:1px solid #347551;background:#06100c;color:white}.full{grid-column:1/-1}button{background:#105032;border-color:#45f493;font-weight:800;font-size:15px}.r{margin-top:9px}.ok{color:#4df397}.bad{color:#ff657d}.wait{color:#ffd36a}.m{font-size:12px;color:#bdd6ca;margin-top:5px;line-height:1.5}pre{font-size:9px;white-space:pre-wrap;max-height:65px;overflow:auto;background:#030906;padding:6px;border-radius:6px}.sum{border-color:#43d98a}@media(max-width:600px){.g{grid-template-columns:1fr}}</style></head><body>

<div class=g><div class=x><label>Symbole</label><input id=s value=BTCUSDT></div><div class=x><label>TF</label><select id=tf><option>1m</option><option>5m</option><option selected>15m</option><option>30m</option><option>1h</option><option>2h</option><option>4h</option><option>6h</option><option>12h</option><option>1d</option><option>1w</option></select></div><div class="x full"><button id=go>🧪 TESTER LES 10 ROUTES</button></div></div><div id=o></div>
<script>
const R=[
["Bitunix DIRECT",u=>u],
["CORS.SH",u=>"https://proxy.cors.sh/"+u],
["AllOrigins RAW",u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u)],
["CodeTabs",u=>"https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent(u)],
["CORS.lol",u=>"https://api.cors.lol/?url="+encodeURIComponent(u)],
["corsproxy.nl",u=>"https://corsproxy.nl/"+u.replace(/^https?:\/\//,"")],
["CorsBridge",u=>"https://api.cors.syrins.tech/?url="+encodeURIComponent(u)],
["Render CORSproxy",u=>"https://corsproxy-8uo5.onrender.com/?url="+encodeURIComponent(u)],
["AllOrigins GET",u=>"https://api.allorigins.win/get?url="+encodeURIComponent(u)],
["ThingProxy",u=>"https://thingproxy.freeboard.io/fetch/"+u]
];
function arr(j){let a=j?.data?.list??j?.data??j?.result?.list??j?.result??[];if(j?.contents){try{return arr(JSON.parse(j.contents))}catch(e){}}return Array.isArray(a)?a:[]}
function box(n){let d=document.createElement("div");d.className="r";d.innerHTML=`<b>${n}</b><div class="st wait">⏳</div><div class=m></div><pre></pre>`;o.appendChild(d);return d}
async function T(n,f,u){let d=box(n),st=d.querySelector(".st"),m=d.querySelector(".m"),p=d.querySelector("pre"),c=new AbortController(),timer=setTimeout(()=>c.abort(),10000),t=performance.now();try{let q=await fetch(f(u),{cache:"no-store",credentials:"omit",signal:c.signal}),z=await q.text(),ms=Math.round(performance.now()-t),j;try{j=JSON.parse(z)}catch(e){}let a=j?arr(j):[],good=q.ok&&a.length>0;st.className="st "+(good?"ok":"bad");st.textContent=good?`✅ ${a.length} chandelles — ${ms} ms`:`❌ HTTP ${q.status} / ${a.length} chandelle`;m.textContent=`HTTP ${q.status} • JSON ${j?"OUI":"NON"} • ${ms} ms`;p.textContent=z.slice(0,500);return{n,good,ms,count:a.length}}catch(e){let ms=Math.round(performance.now()-t);st.className="st bad";st.textContent="❌ "+(e.name==="AbortError"?"TIMEOUT":"FETCH/CORS");m.textContent=`${ms} ms • ${e.name}`;p.textContent=e.message;return{n,good:false,ms,count:0}}finally{clearTimeout(timer)}}
go.onclick=async()=>{o.innerHTML="";let u=`https://fapi.bitunix.com/api/v1/futures/market/kline?symbol=${encodeURIComponent(s.value.trim().toUpperCase())}&interval=${encodeURIComponent(tf.value)}&limit=200&endTime=${Date.now()}&type=LAST_PRICE`,res=[];for(let r of R)res.push(await T(r[0],r[1],u));let good=res.filter(x=>x.good).sort((a,b)=>a.ms-b.ms),d=document.createElement("div");d.className="r sum";d.innerHTML="<b>🏁 CLASSEMENT DES ROUTES FONCTIONNELLES</b><div class=m>"+(good.length?good.map((x,i)=>`${i+1}. ${x.n} — ${x.ms} ms — ${x.count} chandelles`).join("<br>"):"Aucune route fonctionnelle sur ce passage.")+"<br><br>Envoie-moi une capture de ce classement.</div>";o.appendChild(d)}
</script></body></html>
