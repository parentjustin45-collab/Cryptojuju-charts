<script>
const syms=["BTCUSDT","ETHUSDT","XRPUSDT","SOLUSDT","BNBUSDT","ADAUSDT","DOGEUSDT","AVAXUSDT","LINKUSDT","DOTUSDT"];
const frames={"1m":"1m","5m":"5m","15m":"15m","30m":"30m","1H":"1h","2H":"2h","4H":"4h","6H":"6h","12H":"12h","1D":"1d","1W":"1w"};
const def=[{s:"BTCUSDT",f:"15m"},{s:"ETHUSDT",f:"1h"},{s:"XRPUSDT",f:"4h"},{s:"SOLUSDT",f:"1d"}];
let cards=[],layout=localStorage.cjLayout13||"one";
function ema(a,n){let k=2/(n+1),v=null,o=[];a.forEach(x=>{v=v===null?x.close:x.close*k+v*(1-k);o.push({time:x.time,value:v})});return o}
function sma(a,n){let q=[],sum=0,o=[];a.forEach(x=>{q.push(x.close);sum+=x.close;if(q.length>n)sum-=q.shift();if(q.length===n)o.push({time:x.time,value:sum/n})});return o}

function emaVals(a,n){let k=2/(n+1),v=null,o=[];for(let i=0;i<a.length;i++){let x=a[i];if(x==null){o.push(null);continue}v=v===null?x:x*k+v*(1-k);o.push(v)}return o}
function smaVals(a,n){let q=[],sum=0,o=[];for(let x of a){if(x==null){q=[];sum=0;o.push(null);continue}q.push(x);sum+=x;if(q.length>n)sum-=q.shift();o.push(q.length===n?sum/n:null)}return o}
function rsiVals(d,n){let o=Array(d.length).fill(null);if(d.length<=n)return o;let g=0,l=0;for(let i=1;i<=n;i++){let c=d[i].close-d[i-1].close;g+=Math.max(c,0);l+=Math.max(-c,0)}g/=n;l/=n;o[n]=l===0?100:100-(100/(1+g/l));for(let i=n+1;i<d.length;i++){let c=d[i].close-d[i-1].close;g=(g*(n-1)+Math.max(c,0))/n;l=(l*(n-1)+Math.max(-c,0))/n;o[i]=l===0?100:100-(100/(1+g/l))}return o}
function stochVals(a,n){let o=Array(a.length).fill(null);for(let i=0;i<a.length;i++){if(a[i]==null||i<n-1)continue;let w=a.slice(i-n+1,i+1);if(w.some(x=>x==null))continue;let lo=Math.min(...w),hi=Math.max(...w);o[i]=hi===lo?0:100*(a[i]-lo)/(hi-lo)}return o}
function percentRank(a,n){let o=Array(a.length).fill(null);for(let i=n-1;i<a.length;i++){let x=a[i];if(x==null)continue;let w=a.slice(i-n+1,i+1).filter(v=>v!=null);if(w.length<n)continue;let less=w.filter(v=>v<x).length;o[i]=100*less/(n-1)}return o}
function pivotLow(a,i,l,r){if(i<l||i+r>=a.length||a[i]==null)return false;for(let j=i-l;j<=i+r;j++)if(j!==i&&a[j]!=null&&a[j]<=a[i])return false;return true}
function pivotHigh(a,i,l,r){if(i<l||i+r>=a.length||a[i]==null)return false;for(let j=i-l;j<=i+r;j++)if(j!==i&&a[j]!=null&&a[j]>=a[i])return false;return true}
function calcMomFusion(d){
 const rsi=rsiVals(d,14),st=smaVals(stochVals(rsi,14),3);
 let mom=d.map((x,i)=>i>=10?x.close-d[i-10].close:null),mn=percentRank(mom,100);
 let raw=d.map((x,i)=>(rsi[i]==null||st[i]==null||mn[i]==null)?null:(rsi[i]+st[i]+mn[i])/3);
 let comp=emaVals(raw,3),ef=ema(d,21).map(x=>x.value),es=ema(d,55).map(x=>x.value);
 let bullLast=-999,bearLast=-999,sig=[], bullSignalBars=[],bearSignalBars=[];
 for(let i=1;i<d.length;i++){if(comp[i]==null||comp[i-1]==null)continue;
   let bull=comp[i-1]<=30&&comp[i]>30&&ef[i]>es[i]&&(i-bullLast>=5);
   let bear=comp[i-1]>=70&&comp[i]<70&&ef[i]<es[i]&&(i-bearLast>=5);
   if(bull){sig.push({i,type:"bull",text:"▲"});bullSignalBars.push(i);bullLast=i}
   if(bear){sig.push({i,type:"bear",text:"▼"});bearSignalBars.push(i);bearLast=i}
 }
 let divs=[],lastLow=null,lastHigh=null,lastDiv="None",lastBullDiv=-999,lastBearDiv=-999;
 for(let i=5;i<d.length-5;i++){
   if(pivotLow(comp,i,5,5)){
     if(lastLow && i-lastLow.i<=60){
       let zone=comp[i]<=30||comp[lastLow.i]<=30;
       if(zone&&d[i].low<d[lastLow.i].low&&comp[i]>comp[lastLow.i]){divs.push({a:lastLow.i,b:i,va:comp[lastLow.i],vb:comp[i],type:"regBull",text:"R+"});lastDiv="Reg Bull";lastBullDiv=i}
       if(zone&&d[i].low>d[lastLow.i].low&&comp[i]<comp[lastLow.i]){divs.push({a:lastLow.i,b:i,va:comp[lastLow.i],vb:comp[i],type:"hidBull",text:"H+"});lastDiv="Hid Bull";lastBullDiv=i}
     } lastLow={i};
   }
   if(pivotHigh(comp,i,5,5)){
     if(lastHigh && i-lastHigh.i<=60){
       let zone=comp[i]>=70||comp[lastHigh.i]>=70;
       if(zone&&d[i].high>d[lastHigh.i].high&&comp[i]<comp[lastHigh.i]){divs.push({a:lastHigh.i,b:i,va:comp[lastHigh.i],vb:comp[i],type:"regBear",text:"R-"});lastDiv="Reg Bear";lastBearDiv=i}
       if(zone&&d[i].high<d[lastHigh.i].high&&comp[i]>comp[lastHigh.i]){divs.push({a:lastHigh.i,b:i,va:comp[lastHigh.i],vb:comp[i],type:"hidBear",text:"H-"});lastDiv="Hid Bear";lastBearDiv=i}
     } lastHigh={i};
   }
 }
 let conf=[];
 for(let i of bullSignalBars)if(i-lastBullDiv>=0&&i-lastBullDiv<=10)conf.push({i,type:"bull"});
 for(let i of bearSignalBars)if(i-lastBearDiv>=0&&i-lastBearDiv<=10)conf.push({i,type:"bear"});
 return {comp,sig,divs,conf,ef,es,lastDiv};
}


function candlePrefs(o){
 return {
  bull:o.el.querySelector('[data-x="bullColor"]')?.value||"#ffffff",
  bear:o.el.querySelector('[data-x="bearColor"]')?.value||"#666666"
 };
}


function rmaVals(a,n){
 let o=Array(a.length).fill(null),seed=0;
 if(a.length<n)return o;
 for(let i=0;i<n;i++)seed+=a[i];
 let v=seed/n;o[n-1]=v;
 for(let i=n;i<a.length;i++){v=(v*(n-1)+a[i])/n;o[i]=v}
 return o
}
function vectorEngine(d,tf="15m"){
 const n=d.length,vol=d.map(x=>x.volume||0),rng=d.map(x=>Math.max(x.high-x.low,1e-12));
 const av=rollingSmaNums(vol,20),vs=d.map((x,i)=>vol[i]*rng[i]),avs=rollingSmaNums(vs,20);
 let tr=Array(n).fill(0);for(let i=0;i<n;i++)tr[i]=i===0?rng[i]:Math.max(rng[i],Math.abs(d[i].high-d[i-1].close),Math.abs(d[i].low-d[i-1].close));
 const atr=rmaVals(tr,14);
 let vectors=[],events=[],dir=0,entry=null,entryBar=null,pendingBull=-999999,pendingBear=-999999,lastExitBar=-999999;
 const profiles={
  "15m":{confirmWindow:5,minTradeBars:4,vol:1.56,spread:1.56,body:.63,atr:.86,close:.73,ema:34,split:true,reentryWait:0,exitScore:4},
  "30m":{confirmWindow:4,minTradeBars:5,vol:1.66,spread:1.66,body:.655,atr:.91,close:.755,ema:50,split:true,reentryWait:1,exitScore:4},
  "1h":{confirmWindow:5,minTradeBars:3,vol:1.55,spread:1.55,body:.60,atr:.81,close:.69,ema:34,split:true,reentryWait:0,exitScore:4},
  // 4H / Daily intentionally keep the proven V1.9.1 always-in-trade behaviour.
  "4h":{confirmWindow:5,minTradeBars:2,vol:1.50,spread:1.50,body:.60,atr:.80,close:.70,ema:21,split:false,reentryWait:0,exitScore:4},
  "1d":{confirmWindow:5,minTradeBars:2,vol:1.50,spread:1.50,body:.60,atr:.80,close:.70,ema:21,split:false,reentryWait:0,exitScore:4}
 };
 const baseP=profiles[tf]||profiles["15m"];
  let adapt=1;
  if(tf==="30m"){
   let rel=[];
   for(let j=Math.max(20,n-180);j<n;j++)if(atr[j]!=null&&d[j].close>0)rel.push(atr[j]/d[j].close);
   if(rel.length){rel.sort((a,b)=>a-b);let med=rel[Math.floor(rel.length/2)];const ref=.00175;adapt=Math.max(.88,Math.min(1.08,Math.pow(ref/Math.max(med,1e-8),.22)))}
  }
  const P={...baseP};
  if(tf==="30m"){P.vol*=adapt;P.spread*=adapt;P.body*=Math.pow(adapt,.45);P.atr*=Math.pow(adapt,.65);P.close=Math.max(.72,Math.min(.78,P.close*Math.pow(adapt,.18)))}
  const confirmWindow=P.confirmWindow,minTradeBars=P.minTradeBars;
 const tfTrend=ema(d,P.ema).map(x=>x.value);
 for(let i=0;i<n;i++){
  if(av[i]==null||avs[i]==null||atr[i]==null)continue;
  let x=d[i],body=Math.abs(x.close-x.open),bodyRatio=body/rng[i],relVol=av[i]>0?vol[i]/av[i]:0,relSpread=avs[i]>0?vs[i]/avs[i]:0;
  let bullClose=(x.close-x.low)/rng[i],bearClose=(x.high-x.close)/rng[i],common=[relVol>=P.vol,relSpread>=P.spread,bodyRatio>=P.body,rng[i]>=atr[i]*P.atr];
  let bullScore=common.filter(Boolean).length+(bullClose>=P.close?1:0),bearScore=common.filter(Boolean).length+(bearClose>=P.close?1:0);
  let bull=x.close>x.open&&bullScore>=4,bear=x.close<x.open&&bearScore>=4;
  if(bull||bear)vectors.push({i,type:bull?"bull":"bear"});
  let strongBull=bull&&bullScore===5,strongBear=bear&&bearScore===5;
  let validBull=bull&&(x.close>=tfTrend[i]||strongBull),validBear=bear&&(x.close<=tfTrend[i]||strongBear);
  if(validBull&&!strongBull)pendingBull=i;if(validBear&&!strongBear)pendingBear=i;
  let bullConfirm=pendingBull>=0&&i>pendingBull&&i-pendingBull<=confirmWindow&&x.close>d[i-1].high;
  let bearConfirm=pendingBear>=0&&i>pendingBear&&i-pendingBear<=confirmWindow&&x.close<d[i-1].low;
  let bullTrigger=strongBull||bullConfirm,bearTrigger=strongBear||bearConfirm;
  if(i-pendingBull>confirmWindow)pendingBull=-999999;if(i-pendingBear>confirmWindow)pendingBear=-999999;

  // V1.10.1: Bitunix Futures public WebSocket feed test for Android content:// (no REST/CORS proxy).
  // An opposite valid vector can close a trade; a new trade still needs the full trigger.
  if(P.split&&dir!==0){
   let barsIn=i-entryBar;
   let exitLong=dir===1&&barsIn>=minTradeBars&&validBear&&bearScore>=P.exitScore;
   let exitShort=dir===-1&&barsIn>=minTradeBars&&validBull&&bullScore>=P.exitScore;
   if(exitLong){
    let ret=entry>0?(x.close-entry)/entry*100:null;
    events.push({i,type:"exitLong",text:"EXIT LONG"});if(ret!=null)events.push({i,type:"perfHigh",text:`${ret.toFixed(2)}%`,win:ret>=0});
    dir=0;entry=null;entryBar=null;lastExitBar=i;
   }else if(exitShort){
    let ret=entry>0?(entry-x.close)/entry*100:null;
    events.push({i,type:"exitShort",text:"EXIT SHORT"});if(ret!=null)events.push({i,type:"perfLow",text:`${ret.toFixed(2)}%`,win:ret>=0});
    dir=0;entry=null;entryBar=null;lastExitBar=i;
   }
  }

  if(dir===0){
   if(i-lastExitBar<P.reentryWait)continue;
   if(bullTrigger){dir=1;entry=x.close;entryBar=i;events.push({i,type:"long",text:"LONG"});pendingBull=pendingBear=-999999}
   else if(bearTrigger){dir=-1;entry=x.close;entryBar=i;events.push({i,type:"short",text:"SHORT"});pendingBull=pendingBear=-999999}
   continue
  }

  // Legacy AIT reversal retained only for 4H / Daily.
  if(!P.split){
   let barsIn=i-entryBar;
   if(dir===-1&&bullTrigger&&barsIn>=minTradeBars){let ret=entry>0?(entry-x.close)/entry*100:null;events.push({i,type:"exitShort",text:"EXIT SHORT"});if(ret!=null)events.push({i,type:"perfLow",text:`${ret.toFixed(2)}%`,win:ret>=0});events.push({i,type:"long",text:"LONG"});dir=1;entry=x.close;entryBar=i;pendingBull=pendingBear=-999999}
   else if(dir===1&&bearTrigger&&barsIn>=minTradeBars){let ret=entry>0?(x.close-entry)/entry*100:null;events.push({i,type:"exitLong",text:"EXIT LONG"});if(ret!=null)events.push({i,type:"perfHigh",text:`${ret.toFixed(2)}%`,win:ret>=0});events.push({i,type:"short",text:"SHORT"});dir=-1;entry=x.close;entryBar=i;pendingBull=pendingBear=-999999}
  }
 }
 return {vectors,events}
}

function renderVector(o){
 let on=o.el.querySelector('[data-x="vector"]').checked;
 o.vectorOn=on;
 renderPriceLayers(o);
}
function renderPriceLayers(o){
 let prefs=candlePrefs(o),speedOn=o.el.querySelector('[data-x="speed"]').checked,vectorOn=o.el.querySelector('[data-x="vector"]').checked;
 let base;
 if(speedOn)base=speedEngine(o.data,prefs).bars;
 else base=o.data.map(x=>({time:x.time,open:x.open,high:x.high,low:x.low,close:x.close,color:x.close>=x.open?prefs.bull:prefs.bear,borderColor:x.close>=x.open?prefs.bull:prefs.bear,wickColor:x.close>=x.open?prefs.bull:prefs.bear}));
 let markers=[];
 if(vectorOn){
   let v=vectorEngine(o.data,o.interval);
   for(let q of v.vectors){
     let c=q.type==="bull"?"#00e664":"#ff2d2d",b=base[q.i];
     base[q.i]={...b,color:c,borderColor:c,wickColor:c};
   }
   for(let e of v.events){
     let bull=e.type==="long"||e.type==="exitShort"||e.type==="perfLow";
     let col=e.type.startsWith("exit")?"#ffdc28":e.type.startsWith("perf")?(e.win?"#00e664":"#ff2d2d"):(e.type==="long"?"#00e664":"#ff2d2d");
     markers.push({time:o.data[e.i].time,position:bull?"belowBar":"aboveBar",color:col,shape:bull?"arrowUp":"arrowDown",text:e.text});
   }
 }
 o.cs.setData(base);o.cs.setMarkers(markers.sort((a,b)=>a.time-b.time));
}

function rollingSmaNums(a,n){
 let o=Array(a.length).fill(null),q=[],sum=0;
 for(let i=0;i<a.length;i++){q.push(a[i]);sum+=a[i];if(q.length>n)sum-=q.shift();if(q.length===n)o[i]=sum/n}
 return o
}
function speedEngine(d,prefs={bull:'#ffffff',bear:'#666666'}){
 const n=d.length, vols=d.map(x=>x.volume||0), ranges=d.map(x=>Math.max(x.high-x.low,1e-12));
 const av=rollingSmaNums(vols,20), ar=rollingSmaNums(ranges,20);
 const e13=ema(d,13).map(x=>x.value),e50=ema(d,50).map(x=>x.value),e100=ema(d,100).map(x=>x.value),e200=ema(d,200).map(x=>x.value);
 let bars=[],marks=[];
 for(let i=0;i<n;i++){
   let x=d[i],rng=ranges[i],vavg=av[i]??x.volume??1,ravg=ar[i]??rng;
   let vp=(x.volume||0)/Math.max(vavg,1)*100, sp=rng/Math.max(ravg,1e-12)*100;
   let bull=x.close>x.open,bear=x.close<x.open, high=vp>=200, mid=vp>=150;
   let type= bull&&high?"bullHigh":bear&&high?"bearHigh":bull&&mid&&!high?"bullMid":bear&&mid&&!high?"bearMid":"normal";
   let color=type==="bullHigh"?"#2deb2d":type==="bearHigh"?"#f51e1e":type==="bullMid"?"#1941dc":type==="bearMid"?"#d71edc":bull?prefs.bull:prefs.bear;
   bars.push({time:x.time,open:x.open,high:x.high,low:x.low,close:x.close,color,borderColor:color,wickColor:color});
   // showLabels=false by default in the Pine version: keep detection, no labels/arrows.
 }
 return {bars,marks,e13,e50,e100,e200}
}
function renderSpeed(o){
 let on=o.el.querySelector('[data-x="speed"]').checked;
 if(!on){
  renderPriceLayers(o);
  (o.speedLines||[]).forEach(s=>{try{o.ch.removeSeries(s)}catch(e){}});o.speedLines=[];
  return;
 }
 let s=speedEngine(o.data,candlePrefs(o));renderPriceLayers(o);
 (o.speedLines||[]).forEach(x=>{try{o.ch.removeSeries(x)}catch(e){}});o.speedLines=[];
 const addDyn=(vals)=>{
  let seg=[],state=null;
  const flush=()=>{if(seg.length>1){let l=o.ch.addLineSeries({lineWidth:2,color:state?"#64ff50":"#ff3737",priceLineVisible:false,lastValueVisible:false});l.setData(seg);o.speedLines.push(l)}seg=[]};
  for(let i=0;i<o.data.length;i++){
   if(vals[i]==null){flush();state=null;continue}
   let st=o.data[i].close>=vals[i],p={time:o.data[i].time,value:vals[i]};
   if(state===null){state=st;seg=[p]}
   else if(st===state)seg.push(p);
   else{let prev=seg.at(-1);flush();state=st;seg=prev?[prev,p]:[p]}
  } flush();
 };
 addDyn(s.e13);addDyn(s.e50);addDyn(s.e100);addDyn(s.e200);

function wsChannel(f){
 const m={"1m":"1min","5m":"5min","15m":"15min","30m":"30min","1h":"60min","2h":"2h","4h":"4h","6h":"6h","8h":"8h","12h":"12h","1d":"1day","3d":"3day","1w":"1week","1M":"1month"};
 return "market_kline_"+(m[f]||f);
}
function normalizeWsKline(msg){
 const d=msg&&msg.data;
 if(!d)return [];
 const rows=Array.isArray(d)?d:[d];
 return rows.map(k=>{
  let ts=Number(k.time??k.ts??k.t??msg.ts??0);
  if(ts>1e12)ts=Math.floor(ts/1000);
  return {time:ts,open:Number(k.o??k.open),high:Number(k.h??k.high),low:Number(k.l??k.low),close:Number(k.c??k.close),volume:Number(k.b??k.baseVol??k.volume??0)};
 }).filter(k=>Number.isFinite(k.time)&&k.time>0&&Number.isFinite(k.open)&&Number.isFinite(k.high)&&Number.isFinite(k.low)&&Number.isFinite(k.close));
}
function restInterval(f){return f}
function normalizeRestRows(j){
 const raw=j?.data?.list||j?.data||j?.result?.list||j?.result||[];
 const rows=Array.isArray(raw)?raw:[];
 return rows.map(k=>{
   if(Array.isArray(k)){
     let ts=Number(k[0]);if(ts>1e12)ts=Math.floor(ts/1000);
     return {time:ts,open:Number(k[1]),high:Number(k[2]),low:Number(k[3]),close:Number(k[4]),volume:Number(k[5]||0)};
   }
   let ts=Number(k.time??k.ts??k.t??k.openTime??0);if(ts>1e12)ts=Math.floor(ts/1000);
   return {time:ts,open:Number(k.open??k.o),high:Number(k.high??k.h),low:Number(k.low??k.l),close:Number(k.close??k.c),volume:Number(k.baseVol??k.volume??k.v??0)};
 }).filter(k=>Number.isFinite(k.time)&&k.time>0&&[k.open,k.high,k.low,k.close].every(Number.isFinite));
}
async function fetchJsonTimeout(url,ms=10000,wrapped=false){
 const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),ms);
 try{
  const r=await fetch(url,{method:'GET',cache:'no-store',mode:'cors',credentials:'omit',referrerPolicy:'no-referrer',headers:{'Accept':'application/json'},signal:ctl.signal});
  if(!r.ok)throw Error(`HTTP ${r.status}`);
  const j=await r.json();
  if(wrapped&&typeof j?.contents==='string')return JSON.parse(j.contents);
  return j;
 }finally{clearTimeout(tm)}
}
async function tryHistory(s,f){
 // V1.10.4 — Bitunix Futures history. Important: corsproxy.io uses the target URL
 // directly after '?', not '?url='. We also request an explicit time window.
 const now=Date.now(),mins={"1m":1,"5m":5,"15m":15,"30m":30,"1h":60,"2h":120,"4h":240,"6h":360,"8h":480,"12h":720,"1d":1440,"3d":4320,"1w":10080,"1M":43200}[f]||15;
 const startTime=now-(mins*60*1000*220);
 const qs=`symbol=${encodeURIComponent(s)}&startTime=${Math.floor(startTime)}&endTime=${Math.floor(now)}&interval=${encodeURIComponent(f)}&limit=200&type=LAST_PRICE`;
 const official=`https://fapi.bitunix.com/api/v1/futures/market/kline?${qs}`;
 const attempts=[
  {name:'Bitunix direct',url:official},
  {name:'CORSProxy',url:`https://corsproxy.io/?${encodeURIComponent(official)}`},
  {name:'AllOrigins raw',url:`https://api.allorigins.win/raw?url=${encodeURIComponent(official)}`},
  {name:'AllOrigins JSON',url:`https://api.allorigins.win/get?url=${encodeURIComponent(official)}`,wrapped:true},
  {name:'CodeTabs',url:`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(official)}`}
 ];
 let errors=[];
 for(const a of attempts){
  try{
   const j=await fetchJsonTimeout(a.url,11000,!!a.wrapped);
   if(j && Number(j.code)!==0 && j.code!==undefined)throw Error(`Bitunix code ${j.code}: ${j.msg||''}`);
   const rows=normalizeRestRows(j);
   if(rows.length){
    const u=new Map();rows.forEach(x=>u.set(x.time,x));
    const out=[...u.values()].sort((x,y)=>x.time-y.time);
    out._source=`${a.name} • Bitunix Futures`;
    out._historyError='';
    return out;
   }
   errors.push(`${a.name}: réponse sans historique`);
  }catch(e){errors.push(`${a.name}: ${e.name==='AbortError'?'timeout':(e.message||e)}`)}
 }
 const er=Error(errors.join(' | '));er.historyErrors=errors;throw er;
}
async function wsSnapshot(s,f,waitMs=1800){
 const url="wss://fapi.bitunix.com/public/",ch=wsChannel(f);
 return await new Promise((resolve,reject)=>{
   let done=false,rows=[],ws;
   const finish=(err)=>{if(done)return;done=true;clearTimeout(timer);clearInterval(pinger);try{ws.close()}catch(e){};
     const uniq=new Map();rows.forEach(k=>uniq.set(k.time,k));const out=[...uniq.values()].sort((a,b)=>a.time-b.time);
     if(out.length)resolve(out);else reject(err||Error('WebSocket connecté mais aucune chandelle reçue'))};
   try{ws=new WebSocket(url)}catch(e){reject(e);return}
   const timer=setTimeout(()=>finish(Error('Timeout WebSocket Bitunix')),10000);
   const pinger=setInterval(()=>{try{if(ws.readyState===1)ws.send(JSON.stringify({op:'ping',ping:Math.floor(Date.now()/1000)}))}catch(e){}},5000);
   ws.onopen=()=>ws.send(JSON.stringify({op:'subscribe',args:[{symbol:s,ch}]}));
   ws.onerror=()=>finish(Error('Connexion WebSocket Bitunix bloquée'));
   ws.onmessage=ev=>{try{const msg=JSON.parse(ev.data);if(msg&&msg.ch===ch&&msg.symbol===s){const got=normalizeWsKline(msg);if(got.length){rows.push(...got);setTimeout(()=>finish(null),waitMs)}}}catch(e){}};
 });
}
async function getData(s,f){
 let hist=[];
 let histErr=''; try{hist=await tryHistory(s,f)}catch(e){histErr=e.message||String(e);console.warn('Bitunix history unavailable',e)}
 let live=[];
 try{live=await wsSnapshot(s,f)}catch(e){if(!hist.length)throw e}
 const uniq=new Map();hist.forEach(k=>uniq.set(k.time,k));live.forEach(k=>uniq.set(k.time,k));
 const out=[...uniq.values()].sort((a,b)=>a.time-b.time);
 if(!out.length)throw Error('Aucune chandelle Bitunix reçue');
 out._source=hist._source||(hist.length?'Bitunix REST':'Bitunix WS');
 out._historyError=histErr;
 return out;
}
