name: Backtest validation (development only)
on:
  push:
    branches: [dev/v1.26.0]
    paths:
      - 'backtest/**'
      - '.github/workflows/backtest-validation.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic backtest tests (offline)
        run: node --test backtest/*.test.mjs
