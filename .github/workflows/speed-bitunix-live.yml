name: SPEED Bitunix historical experiments
on:
  workflow_dispatch:
  push:
    branches: [dev/v1.26.0]
    paths:
      - 'backtest/speed-bitunix-live.mjs'
      - 'backtest/speed-report-comparison.mjs'
      - '.github/workflows/speed-bitunix-live.yml'
      - 'backtest/speed-prospective.mjs'
      - '.github/workflows/speed-prospective.yml'
jobs:
  speed-history:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run SPEED color scenarios against Bitunix history
        run: |
          set -o pipefail
          node backtest/speed-bitunix-live.mjs | tee speed-bitunix-report.log
      - name: Export comparable strategy table
        run: node backtest/speed-report-comparison.mjs speed-bitunix-report.log
      - name: Upload research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speed-bitunix-research
          path: |
            speed-bitunix-report.log
            speed-strategy-comparison.csv
            speed-strategy-comparison.json
          if-no-files-found: ignore

  prospective-observation:
    if: github.ref == 'refs/heads/dev/v1.26.0'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run locked prospective observation
        run: |
          set -o pipefail
          node backtest/speed-prospective.mjs | tee speed-prospective.json
      - name: Upload prospective report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speed-prospective-observation
          path: speed-prospective.json
          if-no-files-found: warn
