name: DEV Bitunix real-chart derived OHLC and raw provenance parity (read only)
on:
  push:
    branches: [dev/v1.26.0]
    paths:
      - 'backtest/ohlc-frontend-derived-parity-audit.mjs'
      - '.github/workflows/ohlc-frontend-derived-parity-audit.yml'
  workflow_dispatch:
jobs:
  actual-chart:
    if: github.ref == 'refs/heads/dev/v1.26.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT]
    env:
      CJ_SYMBOL: ${{ matrix.symbol }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual frontend and shared research normalization contracts
        run: node --test backtest/ohlc-frontend-history-integration.test.mjs backtest/ohlc-bitunix-open-envelope.test.mjs backtest/bitunix-duplicate-rollover-replay.test.mjs
      - name: Install isolated browser testing tools
        run: npm install --no-save --no-package-lock playwright@1.56.1 lightweight-charts@4.2.2
      - name: Install Chromium
        run: npx playwright install chromium --only-shell
      - name: Verify 480 closed candles each in actual frontend, original Bitunix REST and derived engine
        run: node backtest/ohlc-frontend-derived-parity-audit.mjs
      - name: Upload complete raw provenance and chart comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cj-real-chart-provenanced-ohlc-480-${{ matrix.symbol }}
          path: cj-derived-frontend-parity-report.json
          retention-days: 30
          if-no-files-found: warn
