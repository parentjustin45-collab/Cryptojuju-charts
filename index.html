<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CryptoJuju Charts V1.10.5</title>
<style>
:root{--bg:#0b0e14;--panel:#111722;--panel2:#171f2d;--line:#263247;--text:#e9eef7;--muted:#8fa0b8;--accent:#6ea8fe;--green:#28c79a;--red:#f05d78;--yellow:#ffd34e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif;overflow:hidden}
header{height:52px;display:flex;align-items:center;gap:7px;padding:6px 9px;border-bottom:1px solid var(--line);background:#0e131c}
.brand{font-weight:850;margin-right:auto;white-space:nowrap}.brand span{color:var(--accent)}.ver{font-size:10px;color:var(--muted)}
button,select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:7px 8px}
button{cursor:pointer}.layout button.active{border-color:var(--accent);background:#1c2940}
#grid{height:calc(100vh - 52px);display:grid;gap:2px;background:var(--line)}
#grid.one{grid-template-columns:1fr;grid-template-rows:1fr}#grid.two{grid-template-columns:1fr 1fr;grid-template-rows:1fr}
#grid.four{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.card{min-width:0;min-height:0;background:var(--panel);position:relative;display:flex;flex-direction:column}.card.fullscreen{position:fixed;inset:0;z-index:100;display:flex!important}
.toolbar{height:42px;display:flex;align-items:center;gap:5px;padding:5px;border-bottom:1px solid var(--line);overflow:auto;white-space:nowrap}.toolbar select{padding:5px 6px}.indBtn{margin-left:auto;border-color:#39527a}.fs{min-width:33px}
.chartWrap{position:relative;flex:1;min-height:0}.chart{position:absolute;inset:0}.watermark{position:absolute;z-index:4;left:12px;top:10px;pointer-events:none}.wmSymbol{font-size:17px;font-weight:800;color:#dfe8f5}.wmTf{font-size:12px;color:var(--muted);margin-left:6px}.ohlc{font-size:10px;color:#9fb0c6;margin-top:3px}
.drawer{position:absolute;z-index:30;right:7px;top:45px;width:275px;max-width:calc(100vw - 14px);background:#121a26;border:1px solid var(--line);border-radius:10px;padding:10px;display:none;box-shadow:0 15px 40px #0009}.drawer.open{display:block}.drawer h3{font-size:14px;margin:2px 0 7px}.row{display:flex;align-items:center;gap:8px;padding:7px 2px}.row input{accent-color:var(--accent)}
.hint{font-size:10px;color:var(--muted);padding:4px 8px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:space-between}.ws{font-weight:850}.live{color:var(--green)}.off{color:var(--red)}.wait{color:var(--yellow)}
@media(max-width:760px){header{height:48px;padding:5px}.brand{font-size:13px}.ver{font-size:9px}#grid{height:calc(100vh - 48px)}#grid.two{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.toolbar{height:38px;padding:3px;gap:3px}.toolbar select,.toolbar button{font-size:10px;padding:5px}.wmSymbol{font-size:13px}.wmTf{font-size:10px}.ohlc{font-size:8px}.watermark{left:7px;top:7px}.hint{font-size:8px;padding:3px 5px;flex-wrap:wrap}}
</style></head>
<body>
<header><div class="brand">Crypto<span>Juju</span> Charts <span class="ver">V1.10.5 LIVE</span></div><div class="layout"><button data-l="one">▣</button><button data-l="two">▥</button><button data-l="four">▦</button></div><button id="reset">↻ Reset</button></header>
<main id="grid"></main>
<script src="https://unpkg.com/lightweight-charts@4.2.2/dist/lightweight-charts.standalone.production.js"></script>
<script>
const syms=["BTCUSDT","ETHUSDT","XRPUSDT","SOLUSDT","BNBUSDT","ADAUSDT","DOGEUSDT","AVAXUSDT","LINKUSDT","DOTUSDT"];
const frames={"1m":"1m","5m":"5m","15m":"15m","30m":"30m","1H":"1h","2H":"2h","4H":"4h","6H":"6h","12H":"12h","1D":"1d","1W":"1w"};
const def=[{s:"BTCUSDT",f:"15m"},{s:"ETHUSDT",f:"1h"},{s:"XRPUSDT",f:"4h"},{s:"SOLUSDT",f:"1d"}];
let cards=[],layout=localStorage.cjLayout15||"one";
function fmt(x){if(!Number.isFinite(x))return"—";if(x>=1000)return x.toFixed(2);if(x>=1)return x.toFixed(4);return x.toFixed(6)}
function ema(a,n){let k=2/(n+1),v=null,o=[];a.forEach(x=>{v=v===null?x.close:x.close*k+v*(1-k);o.push({time:x.time,value:v})});return o}
function sma(a,n){let q=[],sum=0,o=[];a.forEach(x=>{q.push(x.close);sum+=x.close;if(q.length>n)sum-=q.shift();if(q.length===n)o.push({time:x.time,value:sum/n})});return o}
function wsChannel(f){const m={"1m":"1min","5m":"5min","15m":"15min","30m":"30min","1h":"60min","2h":"2h","4h":"4h","6h":"6h","12h":"12h","1d":"1day","1w":"1week"};return"market_kline_"+(m[f]||f)}
function normalizeWsKline(msg){const d=msg&&msg.data;if(!d)return[];return(Array.isArray(d)?d:[d]).map(k=>{let ts=Number(k.time??k.ts??k.t??msg.ts??0);if(ts>1e12)ts=Math.floor(ts/1000);return{time:ts,open:Number(k.o??k.open),high:Number(k.h??k.high),low:Number(k.l??k.low),close:Number(k.c??k.close),volume:Number(k.b??k.baseVol??k.volume??0)}}).filter(k=>Number.isFinite(k.time)&&k.time>0&&[k.open,k.high,k.low,k.close].every(Number.isFinite))}
function normalizeRestRows(j){const raw=j?.data?.list||j?.data||j?.result?.list||j?.result||[];return(Array.isArray(raw)?raw:[]).map(k=>{if(Array.isArray(k)){let t=Number(k[0]);if(t>1e12)t=Math.floor(t/1000);return{time:t,open:+k[1],high:+k[2],low:+k[3],close:+k[4],volume:+(k[5]||0)}}let t=Number(k.time??k.ts??k.t??k.openTime??0);if(t>1e12)t=Math.floor(t/1000);return{time:t,open:+(k.open??k.o),high:+(k.high??k.h),low:+(k.low??k.l),close:+(k.close??k.c),volume:+(k.baseVol??k.volume??k.v??0)}}).filter(k=>Number.isFinite(k.time)&&[k.open,k.high,k.low,k.close].every(Number.isFinite))}
async function fetchJson(url,ms=10000){const c=new AbortController(),tm=setTimeout(()=>c.abort(),ms);try{let r=await fetch(url,{cache:"no-store",mode:"cors",credentials:"omit",signal:c.signal});if(!r.ok)throw Error("HTTP "+r.status);return await r.json()}finally{clearTimeout(tm)}}
async function tryHistory(s,f){const now=Date.now(),mins={"1m":1,"5m":5,"15m":15,"30m":30,"1h":60,"2h":120,"4h":240,"6h":360,"12h":720,"1d":1440,"1w":10080}[f]||15,start=now-mins*60000*220,qs=`symbol=${s}&startTime=${Math.floor(start)}&endTime=${Math.floor(now)}&interval=${f}&limit=200&type=LAST_PRICE`,official=`https://fapi.bitunix.com/api/v1/futures/market/kline?${qs}`,tries=[official,`https://corsproxy.io/?${encodeURIComponent(official)}`,`https://api.allorigins.win/raw?url=${encodeURIComponent(official)}`,`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(official)}`];let errs=[];for(let url of tries){try{let rows=normalizeRestRows(await fetchJson(url,11000));if(rows.length){let u=new Map();rows.forEach(x=>u.set(x.time,x));return[...u.values()].sort((a,b)=>a.time-b.time)}}catch(e){errs.push(e.message)}}throw Error("Historique Bitunix indisponible: "+errs.join(" | "))}
function dateLabel(t,f){let d=new Date(t*1000);return["1m","5m","15m","30m","1h","2h","4h","6h","12h"].includes(f)?d.toLocaleString("fr-CA",{month:"short",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}):d.toLocaleDateString("fr-CA",{year:"2-digit",month:"short",day:"2-digit"})}
function setWsState(o,state,text){let e=o.el.querySelector(".ws");e.className="ws "+(state==="live"?"live":state==="off"?"off":"wait");e.textContent=text}
function renderIndicators(o){Object.values(o.lines).forEach(x=>{try{o.ch.removeSeries(x)}catch(e){}});o.lines={};function add(k,d,w){let s=o.ch.addLineSeries({lineWidth:w,priceLineVisible:false,lastValueVisible:false});s.setData(d);o.lines[k]=s}if(o.el.querySelector('[data-x="e21"]').checked)add("e21",ema(o.data,21),2);if(o.el.querySelector('[data-x="e50"]').checked)add("e50",ema(o.data,50),2);if(o.el.querySelector('[data-x="s200"]').checked)add("s200",sma(o.data,200),1)}
function updateLastUI(o,k,live=false){o.el.querySelector(".ohlc").textContent=`O ${fmt(k.open)}   H ${fmt(k.high)}   L ${fmt(k.low)}   C ${fmt(k.close)}`;o.el.querySelector(".tick").textContent=`${live?"LIVE":"REST"} ${new Date().toLocaleTimeString("fr-CA",{hour12:false})} • C ${fmt(k.close)}`}
function mergeLive(o,k){let last=o.data.at(-1);if(!last||k.time>last.time)o.data.push(k);else if(k.time===last.time)o.data[o.data.length-1]=k;else{let i=o.data.findIndex(x=>x.time===k.time);if(i>=0)o.data[i]=k;else return}o.cs.update(k);updateLastUI(o,k,true);clearTimeout(o.indTimer);o.indTimer=setTimeout(()=>renderIndicators(o),300)}
function stopLive(o){o.wsToken=(o.wsToken||0)+1;clearTimeout(o.reconnectTimer);clearInterval(o.pinger);if(o.ws){try{o.ws.onclose=null;o.ws.close()}catch(e){}}o.ws=null}
function startLive(o,s,f){stopLive(o);const token=o.wsToken,ch=wsChannel(f);let attempts=0;function schedule(){if(token!==o.wsToken)return;attempts++;clearTimeout(o.reconnectTimer);o.reconnectTimer=setTimeout(connect,Math.min(15000,1000*Math.pow(2,Math.min(attempts,4))))}function connect(){if(token!==o.wsToken)return;setWsState(o,"wait","🟡 WS connexion…");let ws;try{ws=new WebSocket("wss://fapi.bitunix.com/public/")}catch(e){schedule();return}o.ws=ws;ws.onopen=()=>{if(token!==o.wsToken)return;attempts=0;setWsState(o,"wait","🟡 WS connecté • attente tick");ws.send(JSON.stringify({op:"subscribe",args:[{symbol:s,ch}]}));clearInterval(o.pinger);o.pinger=setInterval(()=>{try{if(ws.readyState===1)ws.send(JSON.stringify({op:"ping",ping:Math.floor(Date.now()/1000)}))}catch(e){}},5000)};ws.onmessage=ev=>{if(token!==o.wsToken)return;try{let m=JSON.parse(ev.data);if(m&&m.ch===ch&&m.symbol===s){let rows=normalizeWsKline(m);for(let k of rows){mergeLive(o,k);setWsState(o,"live","🟢 WS LIVE")}}}catch(e){console.warn("WS parse",e)}};ws.onerror=()=>setWsState(o,"off","🔴 WS erreur");ws.onclose=()=>{if(token!==o.wsToken)return;setWsState(o,"off","🔴 WS OFF • reconnexion…");schedule()}}connect()}
function make(i){let sv=JSON.parse(localStorage.getItem("cj15_"+i)||"null")||def[i],el=document.createElement("section");el.className="card";el.innerHTML=`<div class="toolbar"><select class="sym">${syms.map(s=>`<option ${s===sv.s?"selected":""}>${s}</option>`).join("")}</select><select class="tf">${Object.entries(frames).map(([k,v])=>`<option value="${v}" ${v===sv.f?"selected":""}>${k}</option>`).join("")}</select><button class="indBtn">＋ Indicateurs</button><button class="fs">⛶</button></div><div class="chartWrap"><div class="chart"></div><div class="watermark"><span class="wmSymbol"></span><span class="wmTf"></span><div class="ohlc">O — H — L — C —</div></div></div><div class="drawer"><h3>Indicateurs CryptoJuju</h3><label class="row"><input type="checkbox" data-x="e21" checked>EMA 21</label><label class="row"><input type="checkbox" data-x="e50">EMA 50</label><label class="row"><input type="checkbox" data-x="s200">SMA 200</label><div style="font-size:10px;color:#8fa0b8;padding-top:8px">V1.10.5 = validation moteur Bitunix LIVE. Les indicateurs CryptoJuju avancés restent gelés pendant ce test.</div></div><div class="hint"><span><span class="ws wait">🟡 WS attente</span> • <span class="feed">Chargement…</span></span><span class="tick">Aucun tick LIVE reçu</span></div>`;document.querySelector("#grid").appendChild(el);let ce=el.querySelector(".chart"),interval=sv.f,ch=LightweightCharts.createChart(ce,{layout:{background:{color:"#111722"},textColor:"#aebbd0"},grid:{vertLines:{color:"#1b2533"},horzLines:{color:"#1b2533"}},rightPriceScale:{visible:true,borderColor:"#344158",scaleMargins:{top:.08,bottom:.08}},timeScale:{visible:true,borderColor:"#344158",timeVisible:true,secondsVisible:false,rightOffset:7,barSpacing:8,minBarSpacing:3,tickMarkFormatter:t=>dateLabel(t,interval)},crosshair:{mode:LightweightCharts.CrosshairMode.Normal},handleScroll:{mouseWheel:true,pressedMouseMove:true,horzTouchDrag:true,vertTouchDrag:false},handleScale:{axisPressedMouseMove:true,mouseWheel:true,pinch:true}}),cs=ch.addCandlestickSeries({upColor:"#28c79a",downColor:"#f05d78",borderVisible:false,wickUpColor:"#28c79a",wickDownColor:"#f05d78",priceLineVisible:true,lastValueVisible:true}),o={i,el,ch,cs,data:[],lines:{},ws:null,wsToken:0,reconnectTimer:null,pinger:null,indTimer:null,get interval(){return interval},set interval(v){interval=v}};new ResizeObserver(()=>ch.applyOptions({width:ce.clientWidth,height:ce.clientHeight})).observe(el);el.querySelector(".indBtn").onclick=()=>el.querySelector(".drawer").classList.toggle("open");el.querySelector(".fs").onclick=()=>{el.classList.toggle("fullscreen");setTimeout(()=>ch.applyOptions({width:ce.clientWidth,height:ce.clientHeight}),40)};el.querySelectorAll("input[data-x]").forEach(x=>x.onchange=()=>renderIndicators(o));el.querySelector(".sym").onchange=()=>load(o);el.querySelector(".tf").onchange=()=>load(o);load(o);return o}
async function load(o){stopLive(o);let s=o.el.querySelector(".sym").value,f=o.el.querySelector(".tf").value;o.interval=f;o.ch.applyOptions({timeScale:{tickMarkFormatter:t=>dateLabel(t,f)}});o.el.querySelector(".wmSymbol").textContent=s.replace("USDT"," / USDT");o.el.querySelector(".wmTf").textContent=Object.keys(frames).find(k=>frames[k]===f)||f;o.el.querySelector(".feed").textContent="Chargement historique…";o.el.querySelector(".tick").textContent="Aucun tick LIVE reçu";localStorage.setItem("cj15_"+o.i,JSON.stringify({s,f}));try{o.data=await tryHistory(s,f);o.cs.setData(o.data);renderIndicators(o);o.ch.timeScale().fitContent();o.el.querySelector(".feed").textContent=`${o.data.length} chandelle(s) • Bitunix Futures`;if(o.data.length)updateLastUI(o,o.data.at(-1),false)}catch(e){console.error(e);o.data=[];o.cs.setData([]);o.el.querySelector(".feed").textContent=e.message}startLive(o,s,f)}
function setL(x){layout=x;localStorage.cjLayout15=x;let g=document.querySelector("#grid");g.className=x;document.querySelectorAll(".layout button").forEach(b=>b.classList.toggle("active",b.dataset.l===x));let n=x==="one"?1:x==="two"?2:4;cards.forEach((c,i)=>c.el.style.display=i<n?"flex":"none");setTimeout(()=>cards.forEach(c=>c.ch.applyOptions({width:c.el.querySelector(".chart").clientWidth,height:c.el.querySelector(".chart").clientHeight})),40)}
for(let i=0;i<4;i++)cards.push(make(i));document.querySelectorAll(".layout button").forEach(b=>b.onclick=()=>setL(b.dataset.l));document.querySelector("#reset").onclick=()=>{Object.keys(localStorage).filter(k=>k.startsWith("cj")).forEach(k=>localStorage.removeItem(k));location.reload()};setL(layout);
</script></body></html>
