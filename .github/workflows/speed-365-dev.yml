name: SPEED Bitunix 365-day research (dev)
on:
  push:
    branches: [dev/v1.26.0]
    paths:
      - '.github/workflows/speed-365-dev.yml'
      - 'backtest/speed-ema-filter.mjs'
      - 'backtest/speed-ema-strategy-comparison.mjs'
      - 'backtest/speed-ema-strategy-comparison.test.mjs'
      - 'backtest/speed-ema-holdout.mjs'
      - 'backtest/speed-ema-holdout.test.mjs'
      - 'backtest/speed-ema-risk-holdout.mjs'
      - 'backtest/speed-ema-risk-holdout.test.mjs'
      - 'backtest/speed-bitunix-live.mjs'
      - 'backtest/vector-ait-v1.mjs'
      - 'backtest/vector-ait-v1.test.mjs'
      - 'backtest/vector-speed-comparison.mjs'
      - 'backtest/vector-speed-comparison.test.mjs'
      - 'backtest/vector-exit-selection.mjs'
      - 'backtest/vector-exit-selection.test.mjs'
      - 'backtest/vector-exit-report.mjs'
      - 'backtest/vector-exit-report.test.mjs'
  workflow_dispatch:
jobs:
  research-365-days:
    if: github.ref == 'refs/heads/dev/v1.26.0'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate EMA research tests
        run: node --test backtest/speed-ema-filter.test.mjs backtest/speed-ema-interactions.test.mjs backtest/speed-ema-strategy-comparison.test.mjs backtest/speed-ema-holdout.test.mjs backtest/speed-ema-risk-holdout.test.mjs backtest/vector-ait-v1.test.mjs backtest/vector-speed-comparison.test.mjs backtest/vector-exit-selection.test.mjs backtest/vector-exit-report.test.mjs
      - name: Run 365-day Bitunix SPEED research
        env:
          SPEED_HISTORY_DAYS: '365'
        run: |
          set -o pipefail
          node backtest/speed-bitunix-live.mjs | tee speed-bitunix-report.log
      - name: Export comparable strategy table
        run: node backtest/speed-report-comparison.mjs speed-bitunix-report.log
      - name: Export detailed Vector exit audit
        run: node backtest/vector-exit-report.mjs speed-bitunix-report.log
      - name: Upload 365-day results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speed-bitunix-365-day-research
          path: |
            speed-bitunix-report.log
            speed-strategy-comparison.csv
            speed-strategy-comparison.json
            vector-exit-comparison.csv
            vector-exit-comparison.json
          if-no-files-found: warn
