name: Bitunix live history smoke
on:
  push:
    branches: [dev/v1.26.0]
    paths:
      - '.github/workflows/bitunix-live-smoke.yml'
      - 'backtest/bitunix-smoke.mjs'
      - 'backtest/bitunix-adapter.mjs'
      - 'backtest/bitunix-history.mjs'
      - 'backtest/history-validation.mjs'
  workflow_dispatch:
jobs:
  check-history:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate live BTCUSDT 15m history (read only)
        run: node backtest/bitunix-smoke.mjs
